# Supabase project configuration — Steffny Couture Web
# Generated for Phase 2 setup. Shared project with the mobile app.
#
# To link this project to your Supabase project:
#   npx supabase login
#   npx supabase link --project-ref <YOUR_PROJECT_REF>
#
# Then apply web-only migrations:
#   npx supabase db push
#
# YOUR_PROJECT_REF is the value in Settings → General in the Supabase dashboard.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
port = 54321

[analytics]
enabled = false
